# systemd-tmpfiles: cria a trava única da captura do DJEN, de root, legível por todos.
# Vai para /etc/tmpfiles.d/tempestivo-djen.conf (depois: sudo systemd-tmpfiles --create).
# Criada por root, ela pode ser aberta pelos usuários nanobot-* mesmo com fs.protected_regular,
# que bloqueia abrir com O_CREAT um arquivo de outro usuário num diretório com sticky bit.
# NÃO INSTALADO na etapa 5, fatia 1.
f /run/lock/tempestivo-djen.lock 0644 root root -
